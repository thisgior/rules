mixed-port: 7890
mode: rule
log-level: info

proxies:
  - name: 本机测试节点
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: 故障转移
    type: fallback
    proxies:
      - 本机测试节点
    url: https://cp.cloudflare.com/generate_204
    interval: 300
  - name: 金融服务
    type: select
    proxies:
      - 故障转移
      - DIRECT

rule-providers:
  private-domains:
    type: http
    behavior: domain
    format: yaml
    url: https://rules.example/private.yaml
    path: ./ruleset/private-domains.yaml
    interval: 86400

rules:
  - DOMAIN,api.example,金融服务
  - DOMAIN-SUFFIX,example.com,金融服务
  - RULE-SET,private-domains,DIRECT
  - MATCH,故障转移
